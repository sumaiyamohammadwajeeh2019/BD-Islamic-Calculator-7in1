# render.yaml - BD Islamic Calculator 2026
# Developed by Dr. Sumaiya Mohammad

services:
    - type: web
    name: bd-calculator-dr-sumaiya
    env: static
    plan: free
    branch: main
    rootDir: ./
    buildCommand: echo "Static site - No build needed"
    staticPublishPath: ./
    routes:
            - type: rewrite
        source: /*
        destination: /BD-Calculator-Dr-Sumaiya-Final.html
    headers:
            - path: /*
        name: Cache-Control
        value: public, max-age=3600
            - path: /*.html
        name: X-Content-Type-Options
        value: nosniff
    envVars:
            - key: APP_NAME
        value: BD Calculator 2026 - Dr Sumaiya Mohammad
            - key: DEVELOPER
        value: Dr. Sumaiya Mohammad
            - key: BKASH_DONATION
        value: 01742701642
        sync: false

